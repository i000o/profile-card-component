<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="sass/output.css">
  <title> Frontend Mentor | Profile card component </title>
</head>

<body>
    <section> 
      <img class="bg" src="images/bg-pattern-card.svg" alt="profile background pattern">
      <div> 
        <h1>Victor Crest</h1>
        <h2>26</h2>
      </div>
      <h3>London</h3>
      <img class="profile" src="images/image-victor.jpg" alt="profile icon">

      <hr>
      
      <div class="stats"> 
        <div class="l-stat"> 
          <h4>80K</h4>
          <p>Followers</p>
        </div>

        <div class="center-stat"> 
          <h4>803K</h4>
          <p>Likes</p>
        </div>
        
        <div class="r-stat"> 
          <h4>1.4K</h4>
          <p>Photos</p>
        </div>
      </div>
    </section>

  <footer>
    <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">&nbsp;Frontend Mentor</a>. Coded by <a href="#">&nbsp;Iman Osman</a>.
    </div>
  </footer>
</body>
</html>
